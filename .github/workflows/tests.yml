name: Source tests
on: [push, pull_request, workflow_dispatch]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
      - run: python scripts/smoke_test.py --out-dir runs/ci-smoke --device cpu
      - run: python scripts/package_release.py --output dist/MERC-source.zip

